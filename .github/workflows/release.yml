# タグを打つと、WordPressがそのまま展開できる形のzipを作ってReleaseに添付する。
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# GitHubが自動生成するソースzipは中のフォルダ名が「hb-base-1.0.1」になり、
# そのまま入れるとプラグインが別物として増える。だから自前で hb-base/ に詰め直す。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョンの食い違いを検出する
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 '^ \* Version:' hb-base.php | sed 's/.*Version: *//' | tr -d ' \r')
          if [ "$TAG" != "$HEADER" ]; then
            echo "タグ($TAG)とプラグインヘッダ($HEADER)が一致しません。" >&2
            exit 1
          fi

      - name: zipを作る
        run: |
          mkdir -p build/hb-base
          # docs/ は検査用。zip の中身は各サイトの wp-content/plugins/hb-base/ に展開され、
          # そこに置いた物はブラウザから直接 GET できる（実測で 200）。
          # 本番の公開ディレクトリに検査用ファイルを置く理由が無いので除く。
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='docs' \
            ./ build/hb-base/
          cd build && zip -rq hb-base.zip hb-base

      - uses: softprops/action-gh-release@v2
        with:
          files: build/hb-base.zip
          generate_release_notes: true
